services:
  backend:
    build:
      context: ./django-backend
    container_name: django_backend
    expose:
      - 8000
    env_file:
      - .env
    command: >
      gunicorn backtester.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60

  frontend:
    build:
      context: ./django-front
    container_name: vite_frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
